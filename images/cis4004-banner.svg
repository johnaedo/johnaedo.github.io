<svg width="1360" height="400" viewBox="0 0 1360 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>CIS 4004 — Web-based Information Technology</title>
  <desc>Course banner for CIS 4004 at the University of Central Florida, Department of Computer Science, Dr. John Aedo</desc>

  <defs>
    <linearGradient id="codefade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111" stop-opacity="0" />
      <stop offset="100%" stop-color="#111111" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111" stop-opacity="1" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111111" stop-opacity="1" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="botfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111111" stop-opacity="0" />
      <stop offset="100%" stop-color="#111111" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1360" height="400" fill="#111111" />

  <!-- Grid lines — vertical -->
  <line x1="120"  y1="0" x2="120"  y2="400" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="240"  y1="0" x2="240"  y2="400" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="360"  y1="0" x2="360"  y2="400" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="480"  y1="0" x2="480"  y2="400" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="600"  y1="0" x2="600"  y2="400" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="720"  y1="0" x2="720"  y2="400" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="840"  y1="0" x2="840"  y2="400" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="960"  y1="0" x2="960"  y2="400" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="1080" y1="0" x2="1080" y2="400" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="1200" y1="0" x2="1200" y2="400" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="1320" y1="0" x2="1320" y2="400" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />

  <!-- Grid lines — horizontal -->
  <line x1="0" y1="80"  x2="1360" y2="80"  stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="0" y1="160" x2="1360" y2="160" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="0" y1="240" x2="1360" y2="240" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />
  <line x1="0" y1="320" x2="1360" y2="320" stroke="rgba(255,201,4,0.06)" stroke-width="0.5" />

  <!-- Grid intersection dots (right half only) -->
  <circle cx="720"  cy="80"  r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="840"  cy="80"  r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="960"  cy="80"  r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1080" cy="80"  r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1200" cy="80"  r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1320" cy="80"  r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="720"  cy="160" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="840"  cy="160" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="960"  cy="160" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1080" cy="160" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1200" cy="160" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1320" cy="160" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="720"  cy="240" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="840"  cy="240" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="960"  cy="240" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1080" cy="240" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1200" cy="240" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1320" cy="240" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="720"  cy="320" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="840"  cy="320" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="960"  cy="320" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1080" cy="320" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1200" cy="320" r="2.5" fill="rgba(255,201,4,0.15)" />
  <circle cx="1320" cy="320" r="2.5" fill="rgba(255,201,4,0.15)" />

  <!-- Code watermark — React JSX component snippet -->
  <text font-family="'Ubuntu Mono', 'Courier New', monospace" font-size="18" fill="rgba(255,201,4,0.42)" x="1020" y="108">import { useState } from 'react';</text>
  <text font-family="'Ubuntu Mono', 'Courier New', monospace" font-size="18" fill="rgba(255,201,4,0.42)" x="1020" y="138"> </text>
  <text font-family="'Ubuntu Mono', 'Courier New', monospace" font-size="18" fill="rgba(255,201,4,0.42)" x="1020" y="168">export default function App() {</text>
  <text font-family="'Ubuntu Mono', 'Courier New', monospace" font-size="18" fill="rgba(255,201,4,0.42)" x="1020" y="198">  const [count, setCount] = useState(0);</text>
  <text font-family="'Ubuntu Mono', 'Courier New', monospace" font-size="18" fill="rgba(255,201,4,0.42)" x="1020" y="228">  return (</text>
  <text font-family="'Ubuntu Mono', 'Courier New', monospace" font-size="18" fill="rgba(255,201,4,0.42)" x="1020" y="258">    &lt;button onClick={() =&gt; setCount(c =&gt; c+1)}&gt;</text>
  <text font-family="'Ubuntu Mono', 'Courier New', monospace" font-size="18" fill="rgba(255,201,4,0.42)" x="1020" y="288">      Clicks: {count}  &lt;/button&gt;  )</text>
  <text font-family="'Ubuntu Mono', 'Courier New', monospace" font-size="18" fill="rgba(255,201,4,0.24)" x="1020" y="318">// Spring 2025 · CIS 4004</text>

  <!-- Fade masks over code -->
  <rect x="1260" y="0"   width="100" height="400" fill="url(#codefade)" />
  <rect x="1020" y="0"   width="120" height="400" fill="url(#leftfade)" />
  <rect x="0"    y="0"   width="1360" height="80"  fill="url(#topfade)" />
  <rect x="0"    y="320" width="1360" height="80"  fill="url(#botfade)" />

  <!-- Gold left accent bar -->
  <rect x="80" y="104" width="5" height="192" rx="2.5" fill="#ffc904" />

  <!-- Text -->
  <text font-family="'Karla', sans-serif" font-size="22" font-weight="500" letter-spacing="0.12em" fill="#ffc904"         x="104" y="138">UNIVERSITY OF CENTRAL FLORIDA</text>
  <text font-family="'Karla', sans-serif" font-size="72" font-weight="500"                          fill="#ffffff"         x="100" y="224">CIS 4004</text>
  <text font-family="'Karla', sans-serif" font-size="26" font-weight="400"                          fill="#aaaaaa"         x="104" y="262">Web-based Information Technology</text>
  <text font-family="'Karla', sans-serif" font-size="18" font-weight="400"                          fill="#555555"         x="104" y="294">Department of Computer Science · Dr. John Aedo</text>

  <!-- Bottom gold rule -->
  <rect x="100" y="308" width="920" height="2" rx="1" fill="#ffc904" opacity="0.4" />
</svg>
