<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d"><title id="t">Three-schema architecture</title><desc id="d">External views sit above one conceptual schema, which sits above one physical schema.</desc><rect x="0" y="0" width="900" height="470" fill="#ffffff" rx="10"/>
