        <script type="text/javascript">
            function pageInIframe() {
                return window.location !== window.parent.location;
            }

            let forgetPop = true;
            function onPopState(event) {
                if (forgetPop) {
                    forgetPop = false;
                } else if (pageInIframe()) {
                    parent.postMessage(
                        event.target.location.href,
                        "app://obsidian.md",
                    );
                }
            }
            window.onpopstate = onPopState;
            window.onmessage = (event) => {
                if (event.data == "reload") {
                    window.document.location.reload();
                }
                forgetPop = true;
            };

            function fitElements() {
                const itemsToFit = document.getElementsByClassName("fitText");
                for (const item in itemsToFit) {
                    if (Object.hasOwnProperty.call(itemsToFit, item)) {
                        const element = itemsToFit[item];
                        fitElement(element, 1, 1000);
                        element.classList.remove("fitText");
                    }
                }
            }

            function fitElement(element, start, end) {
                let size = (end + start) / 2;
                element.style.fontSize = `${size}px`;

                if (Math.abs(start - end) < 1) {
                    while (element.scrollHeight > element.offsetHeight) {
                        size--;
                        element.style.fontSize = `${size}px`;
                    }
                    return;
                }

                if (element.scrollHeight > element.offsetHeight) {
                    fitElement(element, start, size);
                } else {
                    fitElement(element, size, end);
                }
            }

            document.onreadystatechange = () => {
                fitElements();
                if (document.readyState === "complete") {
                    if (
                        pageInIframe() &&
                        window.location.href.indexOf("?export") != -1
                    ) {
                        parent.postMessage(
                            event.target.location.href,
                            "app://obsidian.md",
                        );
                    }
                    if (window.location.href.indexOf("print-pdf") != -1) {
                        let stateCheck = setInterval(() => {
                            clearInterval(stateCheck);
                            window.print();
                        }, 250);
                    }
                }
            };
        </script>

                        ## Creating a Repository & Initializing a Codespace

                        - **GitHub Repository (a.k.a. repo)**: The source of truth for your code.
                        	- This is where your code lives online.
                        	- We'll discuss local development later, but for now we'll stick to online coding.

                        ## Git Basics & Repo Relations
                        The VM Nature of Codespaces

                        ### The Workflow:
                        1. **Local Repo vs. Remote**:
                          - **Codespace**: The ephemeral VM running on GitHub's servers.
                          - **GitHub Repo**: The permanent storage of your code.
                        1. **Synchronization**:
                          - Changes in the Codespace do **not** auto-push to GitHub.
                          - You must manually manage files.

                        ### Commands:
                        ```bash
                        git status            # Check uncommitted changes
                        git add .             # Stage all files
                        git commit -m "hello world" # Save state
                        git push              # Push to GitHub

                        ### Key Concept:
                        - **VM Nature**: If you close the Codespace without pushing, changes might exist only in the container memory.
                        - **Persistence**: You must `git push` to save your work to the permanent repository.

                        > **Tip**: The code you see in the Repo (GitHub.com) might lag behind the code you are editing in the Codespace until you commit and push.

        <script>
            function extend() {
                const target = {};
                for (let i = 0; i < arguments.length; i++) {
                    const source = arguments[i];
                    for (const key in source) {
                        if (source.hasOwnProperty(key)) {
                            target[key] = source[key];
                        }
                    }
                }
                return target;
            }

            function isLight(color) {
                // normalize to rgb(a)
                const optionEl = document.createElement("option");
                optionEl.style.color = color;
                const normalizedColor = optionEl.style.color;

                const [_, c_r, c_g, c_b] =
                    normalizedColor.match(/(\d+), (\d+), (\d+)/);

                const brightness = (c_r * 299 + c_g * 587 + c_b * 114) / 1000;
                return brightness > 155;
            }

            const bgColor = getComputedStyle(document.documentElement)
                .getPropertyValue("--r-background-color")
                .trim();

            if (isLight(bgColor)) {
                document.body.classList.add("has-light-background");
            } else {
                document.body.classList.add("has-dark-background");
            }

            // default options to init reveal.js
            const defaultOptions = {
                controls: true,
                progress: true,
                history: true,
                center: true,
                transition: "default", // none/fade/slide/convex/concave/zoom
                plugins: [
                    ObsidianMarkdown,
                    RevealHighlight,
                    RevealZoom,
                    RevealNotes,
                    RevealMath.KaTeX,
                    RevealMermaid,
                    RevealChart,
                    RevealCustomControls,
                ],
                allottedTime: "120",

                katex: {
                    local: "plugin/math/katex",
                    extensions: ["mhchem"],
                },
                markdown: {
                    gfm: true,
                },
                mermaid: {
                    theme: isLight(bgColor) ? "default" : "dark",
                },
                customcontrols: {
                    controls: [],
                },
            };

            if (pageInIframe()) {
                defaultOptions.scrollActivationWidth = 5;
            }

            // options from URL query string
            const queryOptions = Reveal().getQueryHash() || {};

            const options = extend(
                defaultOptions,
                {
                    controls: true,
                    progress: true,
                    slideNumber: true,
                    center: true,
                    transition: "slide",
                    transitionSpeed: "default",
                    width: "1920",
                    height: "1080",
                    margin: 0.04,
                },
                queryOptions,
            );
        </script>
